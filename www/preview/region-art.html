<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/app.css">
<style>body{background:#2b2622;margin:0;padding:24px;display:flex;flex-wrap:wrap;gap:24px;font-family:'IBM Plex Mono',monospace;color:#eee}
figure{margin:0;width:360px}figcaption{font-size:12px;margin-top:6px}</style></head><body>
<script type="module">
import { regionArt } from '../engine/regionart.js';
const camp = await (await fetch('../cases/_campaign.json')).json();
const q = new URLSearchParams(location.search), regs = (q.get('r') || '1,6').split(',').map(Number);
for (const style of (q.get('s') || 'sign,survey').split(',')) for (const n of regs) {
  const r = camp.regions[n - 1], fig = document.createElement('figure');
  fig.innerHTML = regionArt(r, style) + `<figcaption>${style} · region ${n} · ${r.name}</figcaption>`;
  document.body.append(fig);
}
await document.fonts.ready; document.body.dataset.ready = '1';
</script></body></html>
