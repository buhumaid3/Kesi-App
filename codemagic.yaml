# Codemagic: builds the iOS app on a Mac in the cloud and sends it to TestFlight.
# Before the first build (all done by you, in your own accounts; no keys ever go into this repo):
#   1. Apple Developer: register the bundle ID  com.buhumaid.kesi  (Identifiers → +).
#   2. App Store Connect: create the app (My Apps → +) with that bundle ID, name "Kesi: Kenya Case Files".
#   3. App Store Connect → Users and Access → Integrations → App Store Connect API: create a key with the
#      App Manager role; download the .p8 once.
#   4. Codemagic → Team settings → Integrations → Developer Portal → Manage keys: add that key and name it
#      exactly  kesi_asc  (the name used below).
#   5. Codemagic → add the GitHub repo → it finds this file → Start new build → workflow "iOS to TestFlight".
# Signing (one time, by you): Codemagic → Settings → codemagic.yaml settings → Code signing identities:
#   iOS certificates → Generate certificate (Apple Distribution, key kesi_asc); then in the Apple Developer
#   portal make an App Store profile for com.buhumaid.kesi with that certificate; then iOS provisioning
#   profiles → Fetch profiles → download it. ios_signing below only uses files already added there.
workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: kesi_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.buhumaid.kesi
      xcode: latest            # Capacitor 8 needs Xcode 26 or later
      node: 22
    triggering:                # also startable by hand from the Codemagic dashboard
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Install
        script: npm ci
      - name: Check the cases
        script: |
          npm run validate
          npm test
      - name: Every region 1 picture is there
        script: npm run images:check
      - name: Build the web bundle
        # --fast: the voice files go in exactly as recorded (the same files the browser plays). The Mac's
        # afconvert re-encode made voices silent in TestFlight 0.8.1, so it is off until it's proven on a device.
        script: npm run build -- --fast
      - name: Copy it into the iOS project
        script: npx cap sync ios
      - name: Version and build number
        script: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Version $VERSION, build $BUILD_NUMBER"
      - name: Signing
        script: xcode-project use-profiles
      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true      # internal testers get it as soon as Apple finishes processing
        # beta_groups:                  # external testers: create a group in TestFlight, then list it here
        #   - Kesi playtest
        submit_to_app_store: false
